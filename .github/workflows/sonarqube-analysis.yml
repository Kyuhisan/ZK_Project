name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  sonarqube-backend:
    name: SonarQube Backend Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze backend
        working-directory: ./02_Backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Kyuhisan_ZK_Project_Backend \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check-backend
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: 02_Backend/target/sonar/report-task.txt

  sonarqube-frontend:
    name: SonarQube Frontend Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './01_Frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./01_Frontend
        run: npm ci

      - name: Run tests (optional, for coverage)
        working-directory: ./01_Frontend
        run: npm run test -- --coverage --watchAll=false || true
        continue-on-error: true

      - name: SonarCloud Scan Frontend
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: 01_Frontend
          args: >
            -Dsonar.projectKey=Kyuhisan_ZK_Project_Frontend
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check-frontend
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: 01_Frontend/.scannerwork/report-task.txt

  quality-gate-status:
    name: Check Overall Quality Gate
    runs-on: ubuntu-latest
    needs: [sonarqube-backend, sonarqube-frontend]
    if: always()

    steps:
      - name: Check Quality Gates
        run: |
          if [ "${{ needs.sonarqube-backend.result }}" != "success" ] || [ "${{ needs.sonarqube-frontend.result }}" != "success" ]; then
            echo "::error::One or more SonarQube quality gates failed!"
            exit 1
          fi
          echo "All quality gates passed!"
