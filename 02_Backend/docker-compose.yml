services:
  backend:
    image: matickuhar/smartsearch-backend:5.0
    platform: linux/amd64
    container_name: smartsearch-backend
    volumes:
      - ./output:/app/output
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mongo
      - mongo-seed
    restart: always

  mongo:
    image: mongo:8.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  mongo-seed:
    image: mongo:8.0
    depends_on:
      - mongo
    volumes:
      - ./mongo-init:/mongo-init
    entrypoint: [ "sh", "/mongo-init/init.sh" ]
    restart: "no"

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: always

volumes:
  mongo_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: