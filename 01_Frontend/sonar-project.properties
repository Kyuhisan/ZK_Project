# Project identification
sonar.projectKey=Kyuhisan_ZK_Project
sonar.organization=kyuhisan
sonar.projectName=SmartSearch
sonar.projectVersion=5.0

# Source code location
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/dist/**,**/build/**,**/coverage/**

# TypeScript/JavaScript settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# SonarCloud settings (change sonar.host.url for self-hosted)
sonar.host.url=https://sonarcloud.io
